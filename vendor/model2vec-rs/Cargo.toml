[package]
edition = "2024"
rust-version = "1.88"
name = "model2vec-rs"
version = "0.4.0"
authors = [
    "Thomas van Dongen <thomasvdongen@proton.me>",
    "Stéphan Tulkens <stephantul@gmail.com>",
]
build = false
exclude = [
    "tests/*",
    "assets/*",
    "local/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Official Rust Implementation of Model2Vec"
homepage = "https://github.com/MinishLab/model2vec-rs"
readme = "README.md"
keywords = [
    "embeddings",
    "model2vec",
    "nlp",
    "rust",
]
categories = [
    "science",
    "text-processing",
]
license-file = "LICENSE"
repository = "https://github.com/MinishLab/model2vec-rs"

[features]
cli = ["dep:clap"]
default = [
    "onig",
    "hf-hub",
]
fancy-regex = [
    "tokenizers/fancy-regex",
    "tokenizers/progressbar",
    "tokenizers/esaxx_fast",
]
hf-hub = [
    "dep:hf-hub",
    "dep:ureq",
]
local-only = []
onig = [
    "tokenizers/onig",
    "tokenizers/progressbar",
    "tokenizers/esaxx_fast",
]
wasm = [
    "local-only",
    "tokenizers/unstable_wasm",
]

[lib]
name = "model2vec_rs"
path = "src/lib.rs"

[[bin]]
name = "model2vec-rs"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "encode"
path = "benches/encode.rs"
harness = false

[[bench]]
name = "nanobeir"
path = "benches/nanobeir.rs"
harness = false

[[bench]]
name = "python_compare"
path = "benches/python_compare.rs"
harness = false

[[bench]]
name = "quantize"
path = "benches/quantize.rs"
harness = false

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
harness = false

[dependencies.anyhow]
version = "1.0"

[dependencies.clap]
version = "4.0"
features = ["derive"]
optional = true

[dependencies.half]
version = "2.0"

[dependencies.hf-hub]
version = "0.4"
features = ["ureq"]
optional = true
default-features = false

[dependencies.safetensors]
version = "0.5"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
features = ["raw_value"]

[dependencies.tokenizers]
version = "0.21"
default-features = false

[dependencies.unicode-normalization]
version = "0.1"

[dependencies.unicode_categories]
version = "0.1"

[dependencies.ureq]
version = "2"
optional = true

[dev-dependencies.approx]
version = "0.5"

[dev-dependencies.serde_json]
version = "1.0"

[dev-dependencies.tempfile]
version = "3"
