<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Eos</title>
<link rel="icon" type="image/png" href="./logo.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101010; overflow: hidden; }
  #root { height: 100vh; width: 100vw; }
</style>
<script>
  // Dark only — force the attribute before the bundle loads so the first paint
  // is dark (no theme flash). The Appearance setting was removed.
  document.documentElement.setAttribute("data-theme", "dark");
</script>
<script>
  // The boot snapshot (src/api/boot.js): what the first paint reads, asked for in one
  // request while the bundle loads. The chat on screen is the one the last session showed.
  (function () {
    var base = window.__EOS_DAEMON_URL;
    if (!base || location.hash === "#plugin-preview") return;
    try {
      var view = localStorage.getItem("cm:activeView");
      var chat = !view || view === "agents" ? localStorage.getItem("cm:selectedId") : null;
      var headers = window.__EOS_UI_TOKEN ? { "x-eos-ui-token": window.__EOS_UI_TOKEN } : {};
      window.__EOS_BOOT = fetch(base + "/api/boot" + (chat ? "?focus=" + encodeURIComponent(chat) : ""), { headers: headers })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    } catch (e) { /* the stores ask their own routes */ }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
