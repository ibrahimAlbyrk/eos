# Windows builds: tests + a packaged Setup.exe and zip per arch. native modules
# (node-pty) and EosHelper's native AOT build only on the arch they target, so
# each arch has its own runner. A published release (scripts/release.sh tags it
# from the Mac) gets the Windows files attached next to the Mac zip.
name: windows

on:
  push:
    # ci/** = a branch pushed only to try the Windows builds.
    branches: [main, dev, "ci/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tests compare file bytes; the runner's git would write CRLF into the
      # repos they create (Eos itself follows the user's git config).
      - name: Git line endings
        run: git config --global core.autocrlf false

      - name: Install packages
        run: |
          bash scripts/bootstrap.sh
          (cd relay && npm install)

      # The suites were written on macOS; until they pass on Windows (plan
      # Phase 0) a failure is reported without blocking the package.
      - name: Test
        continue-on-error: true
        timeout-minutes: 60
        run: |
          failed=""
          for pkg in contracts core infra spawner app/ui; do
            (cd "$pkg" && npm test) || failed="$failed $pkg"
          done
          # manager file by file, each with a deadline, so a hang names its file.
          cd manager
          files=$(node -p 'require("./package.json").scripts.test.replace(/^tsx --test /, "")')
          for f in $files; do
            code=0; timeout 300 npx tsx --test "$f" > ../test-out.log 2>&1 || code=$?
            if [ $code -eq 124 ]; then echo "::error::TIMEOUT $f"; failed="$failed manager:$f"
            elif [ $code -ne 0 ]; then echo "::group::FAIL $f"; grep -E "✖|Error|expected|actual" ../test-out.log | head -40; echo "::endgroup::"; failed="$failed manager:$f"
            fi
          done
          cd ..
          [ -z "$failed" ] || { echo "::error::failing:$failed"; exit 1; }

      - name: Package
        working-directory: app
        run: npm run make

      - name: Collect
        id: files
        run: |
          mkdir dist-win
          cp app/out/make/squirrel.windows/${{ matrix.arch }}/Eos-Setup-${{ matrix.arch }}.exe dist-win/
          cp app/out/make/zip/win32/${{ matrix.arch }}/*.zip "dist-win/Eos-win32-${{ matrix.arch }}.zip"
          ls -la dist-win

      - uses: actions/upload-artifact@v4
        with:
          name: eos-win32-${{ matrix.arch }}
          path: dist-win/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-win/* --clobber
