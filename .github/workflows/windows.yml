# Windows builds: tests + a packaged Setup.exe and zip per arch. native modules
# (node-pty) and EosHelper's native AOT build only on the arch they target, so
# each arch has its own runner. A published release (scripts/release.sh tags it
# from the Mac) gets the Windows files attached next to the Mac zip.
name: windows

on:
  push:
    # ci/** = a branch pushed only to try the Windows builds.
    branches: [main, dev, "ci/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Eos Setup (app/installer-win) is Rust.
      - uses: dtolnay/rust-toolchain@stable

      # Tests compare file bytes; the runner's git would write CRLF into the
      # repos they create (Eos itself follows the user's git config).
      - name: Git line endings
        run: git config --global core.autocrlf false

      - name: Install packages
        run: |
          bash scripts/bootstrap.sh
          (cd relay && npm install)

      # The suites were written on macOS; until they pass on Windows (plan
      # Phase 0) a failure is reported without blocking the package.
      # A release builds a tag whose commits already passed on dev.
      # "[skip tests]" in a commit message on a ci/** branch: package + smoke only.
      - name: Test
        if: github.event_name != 'release' && !contains(github.event.head_commit.message, '[skip tests]')
        continue-on-error: true
        timeout-minutes: 60
        run: |
          failed=""
          for pkg in contracts core infra spawner app/ui; do
            (cd "$pkg" && npm test) || failed="$failed $pkg"
          done
          # manager file by file, each with a deadline, so a hang names its file.
          cd manager
          files=$(node -p 'require("./package.json").scripts.test.replace(/^tsx --test /, "")')
          for f in $files; do
            code=0; timeout 300 npx tsx --test "$f" > ../test-out.log 2>&1 || code=$?
            if [ $code -eq 124 ]; then echo "::error::TIMEOUT $f"; failed="$failed manager:$f"
            elif [ $code -ne 0 ]; then echo "::group::FAIL $f"; grep -E "✖|Error|expected|actual" ../test-out.log | head -40; echo "::endgroup::"; failed="$failed manager:$f"
            fi
          done
          cd ..
          [ -z "$failed" ] || { echo "::error::failing:$failed"; exit 1; }

      - name: Package
        working-directory: app
        # A release build carries Resources/update.json, so it updates itself
        # (docs/updates/00-UPDATES-PLAN.md); push builds stay builds from source.
        env:
          EOS_UPDATE_CHANNEL: ${{ github.event_name == 'release' && 'stable' || '' }}
        run: npm run make

      # Eos Setup on this system: it installs, the installed Eos starts its own
      # daemon (supervised, on its named pipe, with SQLite and the bundled claude)
      # that answers /health, and the uninstaller removes it again.
      - name: Smoke
        timeout-minutes: 8
        run: |
          export EOS_HOME="$RUNNER_TEMP/eos-home"
          # Install the way a user does (Eos Setup, silent mode), then run the installed Eos.
          dest="$(cygpath -w "$RUNNER_TEMP")\\Eos"
          app/out/make/Eos-Setup-${{ matrix.arch }}.exe --silent --dir "$dest" --no-launch
          app="$RUNNER_TEMP/Eos"
          for f in Eos.exe "Uninstall Eos.exe" .eos-install.json resources/app.asar; do
            [ -e "$app/$f" ] || { echo "::error::Eos Setup didn't install $f"; exit 1; }
          done
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Eos' //v DisplayVersion || { echo "::error::Eos isn't registered with Windows"; exit 1; }
          [ -e "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Eos.lnk" ] || { echo "::error::no Start menu shortcut"; exit 1; }
          "$app/Eos.exe" > smoke-app.log 2>&1 &
          ok=""
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:7400/health > health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "--- /health"; cat health.json 2>/dev/null || true; echo
          echo "--- app"; tail -40 smoke-app.log || true
          echo "--- daemon"; tail -60 "$EOS_HOME/logs/daemon.log" || true
          grep -q "socket listening" "$EOS_HOME/logs/daemon.log" || { echo "::error::daemon never opened its named pipe"; ok=""; }
          # Sign in with Claude on a machine without Claude Code: the bundled
          # claude must start and hand out its sign-in page.
          if [ -n "$ok" ]; then
            api=http://127.0.0.1:7400; tok=$(cat "$EOS_HOME/ui-token")
            id=$(curl -fsS -X POST -H "x-eos-ui-token: $tok" -H "content-type: application/json" -d '{}' "$api/api/accounts/anthropic/sign-in" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')
            signin=""
            for i in $(seq 1 45); do
              s=$(curl -fsS -H "x-eos-ui-token: $tok" "$api/api/sign-ins/$id")
              echo "$s" | grep -q '"url"' && { signin=1; break; }
              echo "$s" | grep -qE '"state":"(failed|cancelled)"' && break
              sleep 2
            done
            echo "--- sign-in"; echo "$s"
            curl -fsS -X DELETE -H "x-eos-ui-token: $tok" "$api/api/sign-ins/$id" > /dev/null || true
            [ -n "$signin" ] || { echo "::error::Sign in with Claude never offered its sign-in page"; ok=""; }
          fi
          taskkill //IM Eos.exe //T //F > /dev/null 2>&1 || true
          [ -n "$ok" ] || { echo "::error::the packaged app's daemon never answered /health"; exit 1; }
          # And it uninstalls cleanly.
          "$app/Uninstall Eos.exe" --uninstall --silent
          sleep 6
          [ ! -e "$app/Eos.exe" ] || { echo "::error::Uninstall left Eos.exe behind"; exit 1; }
          ! reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Eos' > /dev/null 2>&1 || { echo "::error::Uninstall left Eos registered"; exit 1; }

      - name: Collect
        id: files
        run: |
          mkdir dist-win
          cp app/out/make/Eos-Setup-${{ matrix.arch }}.exe dist-win/
          cp app/out/make/zip/win32/${{ matrix.arch }}/*.zip "dist-win/Eos-win32-${{ matrix.arch }}.zip"
          ls -la dist-win

      - uses: actions/upload-artifact@v4
        with:
          name: eos-win32-${{ matrix.arch }}
          path: dist-win/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-win/* --clobber
