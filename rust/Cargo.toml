[workspace]
resolver = "3"
members = ["crates/*", "tools/wire-recorder", "xtask"]
# `host/` is the Tauri + CEF workspace (see README.md, "Host workspace"); prototypes are their own workspaces too.
# `vendor/` holds the agent engine's checkout, a workspace of its own (see README.md, "The agent engine").
exclude = ["host", "spikes", "vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
eos-accounts = { path = "crates/eos-accounts" }
eos-app = { path = "crates/eos-app" }
eos-auth = { path = "crates/eos-auth" }
eos-bridge = { path = "crates/eos-bridge" }
eos-config = { path = "crates/eos-config" }
eos-contracts = { path = "crates/eos-contracts" }
eos-core = { path = "crates/eos-core" }
eos-domain = { path = "crates/eos-domain" }
eos-engine = { path = "crates/eos-engine" }
eos-fs = { path = "crates/eos-fs" }
eos-genui = { path = "crates/eos-genui" }
eos-git = { path = "crates/eos-git" }
eos-kit-fs = { path = "crates/eos-kit-fs" }
eos-kit-net = { path = "crates/eos-kit-net" }
eos-kit-proc = { path = "crates/eos-kit-proc" }
eos-kit-sqlite = { path = "crates/eos-kit-sqlite" }
eos-mod-accounts = { path = "crates/eos-mod-accounts" }
eos-mod-agents = { path = "crates/eos-mod-agents" }
eos-mod-fs = { path = "crates/eos-mod-fs" }
eos-mod-pages = { path = "crates/eos-mod-pages" }
eos-mod-plugins = { path = "crates/eos-mod-plugins" }
eos-mod-policy = { path = "crates/eos-mod-policy" }
eos-mod-profile = { path = "crates/eos-mod-profile" }
eos-mod-projects = { path = "crates/eos-mod-projects" }
eos-mod-prompts = { path = "crates/eos-mod-prompts" }
eos-mod-system = { path = "crates/eos-mod-system" }
eos-mod-templates = { path = "crates/eos-mod-templates" }
eos-mod-updates = { path = "crates/eos-mod-updates" }
eos-mod-worker-definitions = { path = "crates/eos-mod-worker-definitions" }
eos-mod-workers = { path = "crates/eos-mod-workers" }
eos-platform = { path = "crates/eos-platform" }
eos-plugin-build = { path = "crates/eos-plugin-build" }
eos-plugin-files = { path = "crates/eos-plugin-files" }
eos-policy = { path = "crates/eos-policy" }
eos-profile = { path = "crates/eos-profile" }
eos-prompts = { path = "crates/eos-prompts" }
eos-runtime = { path = "crates/eos-runtime" }
eos-sessions = { path = "crates/eos-sessions" }
eos-store-files = { path = "crates/eos-store-files" }
eos-store-sqlite = { path = "crates/eos-store-sqlite" }
eos-symbols = { path = "crates/eos-symbols" }
eos-testkit = { path = "crates/eos-testkit" }
eos-update = { path = "crates/eos-update" }
eos-watch = { path = "crates/eos-watch" }
eos-workers = { path = "crates/eos-workers" }

# The agent engine (eos-agent-sdk): a checkout linked at vendor/eos-agent-sdk by
# scripts/link-sdk.sh, at the commit named in SDK_REV. Only `eos-engine` (sessions) and
# `eos-auth` (sign-in) may depend on these.
eos-agent-anthropic = { path = "vendor/eos-agent-sdk/crates/eos-agent-anthropic" }
eos-agent-compat = { path = "vendor/eos-agent-sdk/crates/eos-agent-compat" }
eos-agent-core = { path = "vendor/eos-agent-sdk/crates/eos-agent-core" }
eos-agent-engine = { path = "vendor/eos-agent-sdk/crates/eos-agent-engine" }
eos-agent-mock-api = { path = "vendor/eos-agent-sdk/tools/mock-api" }
eos-agent-openai = { path = "vendor/eos-agent-sdk/crates/eos-agent-openai" }
eos-agent-sdk = { path = "vendor/eos-agent-sdk/crates/eos-agent-sdk" }
eos-agent-testkit = { path = "vendor/eos-agent-sdk/crates/eos-agent-testkit" }
eos-agent-tools-session = { path = "vendor/eos-agent-sdk/crates/eos-agent-tools-session" }
eos-agent-types = { path = "vendor/eos-agent-sdk/crates/eos-agent-types" }

anyhow = "1"
base64 = "0.22"
bytes = "1"
crossbeam-channel = "0.5"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8"] }
flate2 = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
icu_collator = "2"
indexmap = { version = "2", features = ["serde"] }
# FSEvents on macOS: one stream per watched tree, no descriptor per file.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
regress = { version = "0.12", features = ["utf16"] }
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
rusty-leveldb = "3"
ryu-js = "1"
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
# Objects keep insertion order and floats round-trip, as in JavaScript: the wire depends on both.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
serde_norway = "0.9"
serde_path_to_error = "0.1"
sha1 = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2"
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# One address space holds every agent: a panic must unwind to its task's
# boundary instead of ending the app.
# Test and debug builds keep line numbers for our own crates only: with full
# debug info a build folder is several times larger and slower to link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
