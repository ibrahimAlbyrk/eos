[package]
name = "eos"
description = "The Eos application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Runs against an isolated Node daemon instead of the Rust core. Never part of a release.
dev-proxy = ["eos-bridge/dev-proxy"]

[dependencies]
eos-app.workspace = true
eos-bridge.workspace = true
eos-contracts.workspace = true
eos-core.workspace = true
eos-runtime.workspace = true
eos-shell.workspace = true
eos-update.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Not used in code: its build metadata tells `build.rs` where the CEF framework is.
[target.'cfg(target_os = "macos")'.dependencies]
cef-dll-sys.workspace = true

[lints]
workspace = true
