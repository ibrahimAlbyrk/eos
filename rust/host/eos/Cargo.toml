[package]
name = "eos"
description = "The Eos application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Runs against an isolated Node daemon instead of the Rust core. Never part of a release.
dev-proxy = ["eos-bridge/dev-proxy", "dep:eos-core", "dep:serde_json"]

[dependencies]
eos-app.workspace = true
eos-bridge.workspace = true
eos-core = { workspace = true, optional = true }
eos-shell.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
