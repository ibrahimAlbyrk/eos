[package]
name = "eos"
description = "The Eos application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# A development or test run on a copy of real data: no default data folder, no network,
# the dev guard in front of the core, and what the test drivers use (the dev script, the
# measuring probe, a stand-in claude.ai origin). Never part of a release.
dev-run = ["eos-bridge/dev-run"]

[dependencies]
eos-app.workspace = true
eos-bridge.workspace = true
eos-contracts.workspace = true
eos-core.workspace = true
eos-runtime.workspace = true
eos-shell.workspace = true
eos-update.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Not used in code: its build metadata tells `build.rs` where the CEF framework is.
[target.'cfg(target_os = "macos")'.dependencies]
cef-dll-sys.workspace = true

[lints]
workspace = true
