[package]
name = "eos-bridge"
description = "The shell's request path: page request to the core's router, the shell bridges, the dashboard bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A development or test run on a copy of real data: the guard in front of the core
# (`dev`). Never part of a release.
dev-run = []

[dependencies]
eos-contracts.workspace = true
eos-core.workspace = true
eos-runtime.workspace = true

base64.workspace = true
rusty-leveldb.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
eos-app.workspace = true
eos-kit-proc.workspace = true
eos-mod-terminals.workspace = true
eos-platform.workspace = true
eos-pty.workspace = true
eos-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
