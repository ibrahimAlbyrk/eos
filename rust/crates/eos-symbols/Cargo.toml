[package]
name = "eos-symbols"
description = "Go to definition, find references and symbol search by name, from tree-sitter tag queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eos-contracts.workspace = true
eos-core.workspace = true
eos-domain.workspace = true
indexmap.workspace = true
streaming-iterator = "0.1"
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
tree-sitter = "0.26"
# Each grammar is pinned to the version its tag query in `queries/` was written for.
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
