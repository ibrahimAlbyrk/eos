[package]
name = "eos-engine"
description = "Agent sessions on eos-agent-sdk: the one adapter of the agent runtime port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The engine's scripted model API, for an end-to-end test of a crate that may not
# depend on the engine's crates itself (the app's smoke test).
mock-api = ["dep:eos-agent-mock-api"]

[dependencies]
eos-agent-mock-api = { workspace = true, optional = true }
eos-agent-compat.workspace = true
eos-agent-core.workspace = true
eos-agent-engine.workspace = true
eos-agent-sdk.workspace = true
eos-agent-tools-session.workspace = true
eos-agent-types.workspace = true
eos-contracts.workspace = true
eos-core.workspace = true
eos-domain.workspace = true
futures-util.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
eos-agent-compat.workspace = true
eos-agent-mock-api.workspace = true
eos-agent-testkit.workspace = true
eos-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
