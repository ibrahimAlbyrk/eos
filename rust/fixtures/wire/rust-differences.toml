# Where the Rust core answers differently from the recordings on purpose, or
# cannot answer the same yet. `scripts/replay.sh` passes this file: a listed
# difference does not fail the replay, an unlisted one does. An entry that
# says "until …" is removed by whoever lands that work. Format: tools/wire-recorder/src/known.rs.

# ---- on purpose --------------------------------------------------------------

[[known]]
scenario = "*"
at = "/headers/vary"
reason = "CORS headers are an HTTP listener's. There is none: a request reaches the router in process, tagged with its caller by the shell's bridge."

[[known]]
scenario = "*"
at = "/headers/access-control-*"
reason = "CORS headers are an HTTP listener's. There is none: a request reaches the router in process, tagged with its caller by the shell's bridge."

[[known]]
scenario = "19-cors"
reason = "Origin and Host checks (CORS, DNS rebinding) guard a listener on a port. There is none: only the shell's bridge and the gateways can call the router."

[[known]]
scenario = "*"
at = "/json/apiStamp"
reason = "The stamp of the route surface is this build's own (eos-mod-peer/src/stamp.rs), never a TypeScript build's: a computer of one kind loads the other's own dashboard instead of driving it with its own."

[[known]]
scenario = "*"
at = "/json/host/apiStamp"
reason = "The stamp of the route surface is this build's own (eos-mod-peer/src/stamp.rs), never a TypeScript build's: a computer of one kind loads the other's own dashboard instead of driving it with its own."

[[known]]
scenario = "33-settings"
step = "commands-for-folder"
reason = "A folder's menu is what a session there would run: the engine's own bundled skills, not the ones the Claude Code binary ships, and a name found twice is the one the engine's precedence picks."

[[known]]
scenario = "18-http"
step = "head-is-not-get"
at = "/json"
reason = "HTTP never carries the body of an answer to HEAD. In process the router's 404 keeps its JSON body; a page's HEAD request gets none."

[[known]]
scenario = "18-http"
step = "body-not-json"
reason = "A body that is not JSON is the caller's mistake: 400 `invalid request: body is not valid JSON`. The daemon answered 500 with V8's parser message."

[[known]]
scenario = "*"
step = "body-empty"
at = "/json/error"
reason = "eos-contracts names the first field of a body that has the wrong type or is missing; Zod named them all (crates/eos-contracts/README.md)."

[[known]]
scenario = "*"
step = "focus-invalid"
at = "/json/error"
reason = "eos-contracts names the first field of a body that has the wrong type or is missing; Zod named them all (crates/eos-contracts/README.md)."

[[known]]
scenario = "17-browser"
at = "/json/chromePath"
reason = "The recording ran without the app's window, so the daemon named the Chrome it would have started. The app's own views are the browser now: there is no second lane. With a window the status names them as the app does today (`WebContentsView (embedded)`); without one, as in this replay, it is null."

[[known]]
scenario = "17-browser"
at = "/json/state"
reason = "This replay runs the core without a window, and without a window there is no browser: `absent`. With the shell's views the same routes answer `launching`, as recorded (crates/eos-mod-browser/tests/replay.rs replays the scenario over fake views)."
