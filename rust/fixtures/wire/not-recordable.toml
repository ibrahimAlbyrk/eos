[[note]]
why = "Needs a staged update, which only a release build downloads."
routes = [
  "POST /api/update/restart",
]

[[note]]
why = "Needs the dashboard bundle (app/ui/dist) or a plugin with a built UI; the recording daemon runs from source without them."
routes = [
  "GET /ui/plugins/:id/:rev.:ext",
  "GET /ui/*",
]

[[note]]
why = "Not in the Rust app: the terminal-driven agent lane posted its rows here, and every agent now reports through its session. Today's daemon still serves it; nothing records it."
routes = [
  "POST /workers/:id/events",
]
