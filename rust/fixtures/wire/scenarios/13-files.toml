about = "Files on disk: stat, list, search, read, images, the raw-content listener, default apps and editors."

[[step]]
name = "stat-file"
request = "GET /fs/stat"
query = { path = "{sandbox}/beta/notes.md" }
status = 200

[[step]]
name = "stat-folder"
request = "GET /fs/stat"
query = { path = "{sandbox}/alpha" }
status = 200

[[step]]
name = "stat-missing"
request = "GET /fs/stat"
query = { path = "{sandbox}/beta/nope.md" }
status = 404

[[step]]
name = "stat-relative"
request = "GET /fs/stat"
query = { path = "notes.md" }
status = 400

[[step]]
name = "stat-no-path"
request = "GET /fs/stat"
status = 400

[[step]]
name = "list-root"
request = "GET /fs/list"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "list-hidden"
request = "GET /fs/list"
query = { cwd = "{sandbox}/alpha", includeHidden = "1" }
status = 200

[[step]]
name = "list-subfolder"
request = "GET /fs/list"
query = { cwd = "{sandbox}/alpha", dir = "src" }
status = 200

[[step]]
name = "list-escape"
request = "GET /fs/list"
query = { cwd = "{sandbox}/alpha", dir = "../beta" }
status = 400

[[step]]
name = "list-search"
request = "GET /fs/list"
query = { cwd = "{sandbox}/alpha", query = "pars", limit = "5" }
status = 200

[[step]]
name = "list-plain-folder"
request = "GET /fs/list"
query = { cwd = "{sandbox}/beta" }
status = 200

[[step]]
name = "list-no-cwd"
request = "GET /fs/list"
status = 400

[[step]]
name = "list-missing-folder"
request = "GET /fs/list"
query = { cwd = "{sandbox}/nope" }
status = 404

[[step]]
name = "read-text"
request = "GET /fs/read"
query = { path = "{sandbox}/beta/notes.md" }
status = 200

[[step]]
name = "read-binary"
request = "GET /fs/read"
query = { path = "{sandbox}/beta/pixel.png" }
status = 200

[[step]]
name = "read-missing"
request = "GET /fs/read"
query = { path = "{sandbox}/beta/nope.md" }
status = 404

[[step]]
name = "read-folder"
request = "GET /fs/read"
query = { path = "{sandbox}/beta" }
status = 404

[[step]]
name = "read-no-path"
request = "GET /fs/read"
status = 400

[[step]]
name = "image"
request = "GET /fs/image"
query = { path = "{sandbox}/beta/pixel.png" }
status = 200

[[step]]
name = "image-not-an-image"
request = "GET /fs/image"
query = { path = "{sandbox}/beta/notes.md" }
status = 200

[[step]]
name = "image-missing"
request = "GET /fs/image"
query = { path = "{sandbox}/beta/nope.png" }
status = 404

[[step]]
name = "raw-file"
request = "GET /fs/raw{sandbox}/beta/notes.md"
via = "raw"
status = 200

[[step]]
name = "raw-range"
request = "GET /fs/raw{sandbox}/beta/notes.md"
via = "raw"
headers = { range = "bytes=2-6" }
status = 206

[[step]]
name = "raw-missing"
request = "GET /fs/raw{sandbox}/beta/nope.md"
via = "raw"
status = 404

[[step]]
name = "raw-not-on-the-api-port"
request = "GET /fs/raw{sandbox}/beta/notes.md"
status = 404

[[step]]
name = "pdfjs-file"
request = "GET /pdfjs/web/images/toolbarButton-zoomIn.svg"
via = "raw"
status = 200

[[step]]
name = "pdfjs-missing"
request = "GET /pdfjs/web/nope.js"
via = "raw"
status = 404

[[step]]
name = "api-route-not-on-the-raw-port"
request = "GET /workers"
via = "raw"
status = 404

[[step]]
name = "default-app-by-extension"
request = "GET /fs/default-app"
query = { ext = "txt" }
status = 200

[[step]]
name = "default-app-nothing-asked"
request = "GET /fs/default-app"
status = 400

[[step]]
name = "editors"
request = "GET /fs/editors"
status = 200

[[step]]
name = "icon"
request = "GET /fs/icon"
query = { bundleId = "com.apple.TextEdit" }
status = 200

[[step]]
name = "icon-no-bundle"
request = "GET /fs/icon"
status = 400

[[step]]
name = "recents"
request = "GET /fs/recents"
status = 200
