about = "Plugins: the list with built-ins and a folder plugin, one plugin, enable / disable (a built-in's routes then answer 404 plugin_off), settings, stored values, build reports, and the install routes' refusals."

[[step]]
name = "open-stream"
open = "main"
query = { topics = "plugins:*,plugin:*" }

[[step]]
name = "list"
request = "GET /api/plugins"
status = 200

[[step]]
name = "list-without-token"
request = "GET /api/plugins"
auth = "none"
status = 200

[[step]]
name = "one"
request = "GET /api/plugins/hello"
auth = "none"
status = 200

[[step]]
name = "one-builtin"
request = "GET /api/plugins/eos.pages"
status = 200

[[step]]
name = "one-unknown"
request = "GET /api/plugins/nope"
status = 404

[[step]]
name = "one-bad-id"
request = "GET /api/plugins/Bad_Id"
status = 400

[[step]]
name = "status"
request = "GET /api/plugins/hello/status"
query = { wait = "1" }
auth = "none"
status = 200

[[step]]
name = "report"
request = "POST /api/plugins/hello/report"
body = { rev = 0, ok = false, error = "ReferenceError: x is not defined" }
status = 200

[[step]]
name = "status-after-report"
request = "GET /api/plugins/hello/status"
auth = "none"
status = 200

[[step]]
name = "settings-save"
request = "PUT /api/plugins/hello/settings"
body = { values = { greeting = "Hi", loud = true } }
status = 200
wait = ["plugins:change"]

[[step]]
name = "settings-save-without-token"
request = "PUT /api/plugins/hello/settings"
auth = "none"
body = { values = { greeting = "Yo" } }
status = 403

[[step]]
name = "settings-bad-value"
request = "PUT /api/plugins/hello/settings"
body = { values = { greeting = { nested = true } } }
status = 400

[[step]]
name = "store-read-empty"
request = "GET /api/plugins/hello/store/notes"
auth = "none"
status = 200

[[step]]
name = "store-write"
request = "PUT /api/plugins/hello/store/notes"
body = { value = { items = ["a", "b"], count = 2 } }
status = 200

[[step]]
name = "store-read"
request = "GET /api/plugins/hello/store/notes"
auth = "none"
status = 200

[[step]]
name = "store-bad-key"
request = "GET /api/plugins/hello/store/bad%20key"
status = 400

[[step]]
name = "disable"
request = "PUT /api/plugins/hello/enabled"
body = { enabled = false }
status = 200
wait = ["plugins:change"]

[[step]]
name = "enable"
request = "PUT /api/plugins/hello/enabled"
body = { enabled = true }
status = 200
wait = ["plugins:change"]

[[step]]
name = "builtin-off"
request = "PUT /api/plugins/eos.pages/enabled"
body = { enabled = false }
status = 200
wait = ["plugins:change"]

[[step]]
name = "builtin-off-route"
request = "GET /api/pages"
status = 404

[[step]]
name = "builtin-off-write-route"
request = "POST /api/pages"
body = { title = "x" }
status = 404

[[step]]
name = "builtin-on"
request = "PUT /api/plugins/eos.pages/enabled"
body = { enabled = true }
status = 200
wait = ["plugins:change"]

[[step]]
name = "builtin-on-route"
request = "GET /api/pages"
query = { all = "1" }
status = 200

[[step]]
name = "enable-unlisted-builtin"
request = "PUT /api/plugins/eos.archive/enabled"
body = { enabled = false }
status = 404

[[step]]
name = "preview-without-app"
request = "POST /api/plugins/hello/preview"
body = { surface = "main" }
status = 409

[[step]]
name = "install-without-token"
request = "POST /api/plugins/install"
auth = "none"
body = { source = { kind = "local", path = "{sandbox}/beta" } }
status = 403

[[step]]
name = "install-bad-source"
request = "POST /api/plugins/install"
body = { source = { kind = "ftp" } }
status = 400

[[step]]
name = "install-folder-without-manifest"
request = "POST /api/plugins/install"
body = { source = { kind = "local", path = "{sandbox}/beta" } }
status = 400

[[step]]
name = "install-stage"
request = "POST /api/plugins/install"
body = { source = { kind = "local", path = "{sandbox}/plugin-src" } }
status = 200
capture = { staged = "/json/staged/stagingId" }

[[step]]
name = "install-commit"
request = "POST /api/plugins/install/{staged}"
status = 200
wait = ["plugins:change"]

[[step]]
name = "installed-one"
request = "GET /api/plugins/wire-sample"
status = 200

[[step]]
name = "installed-update-check"
request = "POST /api/plugins/wire-sample/update"
status = 200
capture = { staged_update = "/json/staged/stagingId" }

[[step]]
name = "installed-update-discard"
request = "DELETE /api/plugins/install/{staged_update}"
status = 200

[[step]]
name = "installed-remove"
request = "DELETE /api/plugins/wire-sample"
status = 200
wait = ["plugins:change"]

[[step]]
name = "staged-commit-unknown"
request = "POST /api/plugins/install/st-00000000"
status = 404

[[step]]
name = "staged-discard-unknown"
request = "DELETE /api/plugins/install/st-00000000"
status = 200

[[step]]
name = "update-not-installed-from-a-source"
request = "POST /api/plugins/hello/update"
status = 400

[[step]]
name = "remove-builtin"
request = "DELETE /api/plugins/eos.pages"
status = 404

[[step]]
name = "close-stream"
close = "main"
