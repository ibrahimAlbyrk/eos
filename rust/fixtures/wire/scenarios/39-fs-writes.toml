about = "Changing files through the daemon: write, create, rename, move, paste, the folder and git watches with their change frames, recents and projects."

[[step]]
name = "open-stream"
open = "main"
query = { clientId = "wire-tab", topics = "fs:*,git:*,projects:*,recents:*" }

[[step]]
name = "write-without-token"
request = "POST /fs/write"
auth = "none"
body = { path = "{sandbox}/beta/written.md", content = "x" }
status = 403

[[step]]
name = "write"
request = "POST /fs/write"
body = { path = "{sandbox}/beta/written.md", content = "# Written\n" }
status = 200

[[step]]
name = "write-in-root"
request = "POST /fs/write"
body = { root = "{sandbox}/beta", path = "deep/er/file.txt", content = "nested\n", mkdirp = true }
status = 200

[[step]]
name = "write-escapes-root"
request = "POST /fs/write"
body = { root = "{sandbox}/beta", path = "../alpha/x.txt", content = "x" }
status = 400

[[step]]
name = "write-relative"
request = "POST /fs/write"
body = { path = "written.md", content = "x" }
status = 400

[[step]]
name = "write-invalid"
request = "POST /fs/write"
body = { path = "{sandbox}/beta/written.md" }
status = 400

[[step]]
name = "watch"
request = "POST /fs/watch"
body = { root = "{sandbox}/beta", dir = "{sandbox}/beta", clientId = "wire-tab" }
status = 200
pause_ms = 300

[[step]]
name = "watch-without-token"
request = "POST /fs/watch"
auth = "none"
body = { root = "{sandbox}/beta", dir = "{sandbox}/beta", clientId = "wire-tab" }
status = 403

[[step]]
name = "create-file"
request = "POST /fs/create"
body = { root = "{sandbox}/beta", path = "created.txt", type = "file", content = "made\n" }
status = 200
wait = ["fs:change"]
pause_ms = 500

[[step]]
name = "create-folder"
request = "POST /fs/create"
body = { root = "{sandbox}/beta", path = "folder", type = "directory" }
status = 200
wait = ["fs:change"]

[[step]]
name = "create-existing"
request = "POST /fs/create"
body = { root = "{sandbox}/beta", path = "created.txt", type = "file" }
status = 409

[[step]]
name = "create-escape"
request = "POST /fs/create"
body = { root = "{sandbox}/beta", path = "../x.txt", type = "file" }
status = 400

[[step]]
name = "rename"
request = "POST /fs/rename"
body = { root = "{sandbox}/beta", path = "created.txt", newName = "renamed.txt" }
status = 200
wait = ["fs:change"]

[[step]]
name = "rename-bad-name"
request = "POST /fs/rename"
body = { root = "{sandbox}/beta", path = "renamed.txt", newName = "a/b" }
status = 400

[[step]]
name = "rename-missing"
request = "POST /fs/rename"
body = { root = "{sandbox}/beta", path = "nope.txt", newName = "x.txt" }
status = 404

[[step]]
name = "move"
request = "POST /fs/move"
body = { root = "{sandbox}/beta", paths = ["renamed.txt"], destDir = "folder" }
status = 200
wait = ["fs:change"]

[[step]]
name = "move-conflict"
request = "POST /fs/move"
body = { root = "{sandbox}/beta", paths = ["folder/renamed.txt"], destDir = "folder" }
status = 200

[[step]]
name = "list-after"
request = "GET /fs/list"
query = { cwd = "{sandbox}/beta", dir = "folder" }
status = 200

[[step]]
name = "trash-without-token"
request = "POST /fs/trash"
auth = "none"
body = { root = "{sandbox}/beta", paths = ["written.md"] }
status = 403

[[step]]
name = "trash-invalid"
request = "POST /fs/trash"
body = { root = "{sandbox}/beta", paths = [] }
status = 400

[[step]]
name = "unwatch"
request = "POST /fs/unwatch"
body = { root = "{sandbox}/beta", dir = "{sandbox}/beta", clientId = "wire-tab" }
status = 200

[[step]]
name = "unwatch-all"
request = "POST /fs/unwatch"
body = { clientId = "wire-tab", all = true }
status = 200

[[step]]
name = "git-watch"
request = "POST /fs/git/watch"
body = { dir = "{sandbox}/alpha", clientId = "wire-tab" }
status = 200

[[step]]
name = "change-in-watched-repository"
request = "POST /fs/write"
body = { path = "{sandbox}/alpha/watched.txt", content = "seen\n" }
status = 200
wait = ["git:change"]
pause_ms = 500

[[step]]
name = "git-unwatch"
request = "POST /fs/git/unwatch"
body = { dir = "{sandbox}/alpha", clientId = "wire-tab" }
status = 200

[[step]]
name = "paste"
request = "POST /fs/paste"
headers = { x-filename = "clip.txt" }
text = "pasted bytes"
content_type = "application/octet-stream"
status = 200

[[step]]
name = "paste-no-name"
request = "POST /fs/paste"
text = "pasted bytes"
content_type = "application/octet-stream"
status = 400

[[step]]
name = "paste-wrong-type"
request = "POST /fs/paste"
headers = { x-filename = "clip.txt" }
text = "pasted bytes"
content_type = "text/plain"
status = 400

[[step]]
name = "paste-b64"
request = "POST /fs/paste-b64"
body = { name = "clip.txt", dataB64 = "cGFzdGVkIGJ5dGVz" }
status = 200

[[step]]
name = "paste-b64-invalid"
request = "POST /fs/paste-b64"
body = { name = "clip.txt" }
status = 400

[[step]]
name = "open-without-token"
request = "POST /fs/open"
auth = "none"
body = { path = "{sandbox}/beta/notes.md" }
status = 403

[[step]]
name = "open-relative"
request = "POST /fs/open"
body = { path = "notes.md" }
status = 400

[[step]]
name = "reveal-without-token"
request = "POST /fs/reveal"
auth = "none"
body = { path = "{sandbox}/beta/notes.md" }
status = 403

[[step]]
name = "reveal-relative"
request = "POST /fs/reveal"
body = { path = "notes.md" }
status = 400

[[step]]
name = "open-in-without-token"
request = "POST /fs/open-in"
auth = "none"
body = { path = "{sandbox}/beta/notes.md", target = "vscode" }
status = 403

[[step]]
name = "open-in-unknown-editor"
request = "POST /fs/open-in"
body = { path = "{sandbox}/beta/notes.md", target = "notepad" }
status = 400

[[step]]
name = "projects-empty"
request = "GET /projects"
status = 200

[[step]]
name = "project-create"
request = "PUT /projects"
body = { name = "Alpha", folders = ["{sandbox}/alpha", "{sandbox}/beta"], icon = { kind = "emoji", value = "A" }, pinned = true }
status = 200
capture = { project = "/json/project/id" }

[[step]]
name = "project-create-without-token"
request = "PUT /projects"
auth = "none"
body = { name = "Beta", folders = ["{sandbox}/beta"] }
status = 403

[[step]]
name = "project-create-relative"
request = "PUT /projects"
body = { name = "Beta", folders = ["beta"] }
status = 400

[[step]]
name = "project-create-invalid"
request = "PUT /projects"
body = { name = "", folders = [] }
status = 400

[[step]]
name = "project-update"
request = "PUT /projects"
body = { id = "{project}", name = "Alpha renamed", folders = ["{sandbox}/alpha"] }
status = 200

[[step]]
name = "projects"
request = "GET /projects"
status = 200

[[step]]
name = "project-delete"
request = "POST /projects/delete"
body = { id = "{project}" }
status = 200

[[step]]
name = "project-delete-again"
request = "POST /projects/delete"
body = { id = "{project}" }
status = 404

[[step]]
name = "recents"
request = "GET /fs/recents"
status = 200

[[step]]
name = "recent-remove"
request = "POST /fs/recents/remove"
body = { path = "{sandbox}/alpha" }
status = 200

[[step]]
name = "recent-remove-without-token"
request = "POST /fs/recents/remove"
auth = "none"
body = { path = "{sandbox}/alpha" }
status = 403

[[step]]
name = "close-stream"
close = "main"
