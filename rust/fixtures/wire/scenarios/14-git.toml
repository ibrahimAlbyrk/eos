about = "Git reads over a folder: branches, log, commit, changes in each scope, one file's diff, blobs, stashes."

[[step]]
name = "branches"
request = "GET /fs/branches"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "branches-with-remotes"
request = "GET /fs/branches"
query = { cwd = "{sandbox}/alpha", remotes = "1" }
status = 200

[[step]]
name = "branches-not-git"
request = "GET /fs/branches"
query = { cwd = "{sandbox}/beta" }
status = 200

[[step]]
name = "branches-no-cwd"
request = "GET /fs/branches"
status = 400

[[step]]
name = "unpushed"
request = "GET /fs/unpushed"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "log"
request = "GET /fs/log"
query = { cwd = "{sandbox}/alpha", limit = "1" }
status = 200
capture = { head = "/json/commits/0/sha" }

[[step]]
name = "log-next"
request = "GET /fs/log"
query = { cwd = "{sandbox}/alpha", limit = "1", skip = "1" }
status = 200
capture = { first = "/json/commits/0/sha" }

[[step]]
name = "log-bad-limit"
request = "GET /fs/log"
query = { cwd = "{sandbox}/alpha", limit = "101" }
status = 400

[[step]]
name = "commit"
request = "GET /fs/commit"
query = { cwd = "{sandbox}/alpha", sha = "{head}" }
status = 200

[[step]]
name = "commit-bad-sha"
request = "GET /fs/commit"
query = { cwd = "{sandbox}/alpha", sha = "zz" }
status = 400

[[step]]
name = "changes-uncommitted"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "changes-with-patches"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/alpha", patches = "1" }
status = 200

[[step]]
name = "changes-of-commit"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/alpha", sha = "{head}" }
status = 200

[[step]]
name = "changes-against-branch"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/alpha", base = "feature/json" }
status = 200

[[step]]
name = "changes-against-default"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/alpha", base = "auto" }
status = 200

[[step]]
name = "changes-not-git"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/beta" }
status = 200

[[step]]
name = "changes-file"
request = "GET /fs/changes/file"
query = { cwd = "{sandbox}/alpha", path = "README.md" }
status = 200

[[step]]
name = "changes-file-of-commit"
request = "GET /fs/changes/file"
query = { cwd = "{sandbox}/alpha", path = "src/parser.js", sha = "{head}" }
status = 200

[[step]]
name = "changes-file-untracked"
request = "GET /fs/changes/file"
query = { cwd = "{sandbox}/alpha", path = "notes.txt" }
status = 200

[[step]]
name = "changes-file-escape"
request = "GET /fs/changes/file"
query = { cwd = "{sandbox}/alpha", path = "../beta/notes.md" }
status = 200

[[step]]
name = "blob"
request = "GET /fs/blob"
query = { cwd = "{sandbox}/alpha", ref = "{first}", path = "src/parser.js" }
status = 200

[[step]]
name = "blob-missing-path"
request = "GET /fs/blob"
query = { cwd = "{sandbox}/alpha", ref = "{first}", path = "nope.js" }
status = 404

[[step]]
name = "stashes"
request = "GET /fs/stashes"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "stashes-not-git"
request = "GET /fs/stashes"
query = { cwd = "{sandbox}/beta" }
status = 200

[[step]]
name = "symbols-file"
request = "GET /symbols/file"
query = { root = "{sandbox}/alpha", path = "src/parser.js" }
status = 200

[[step]]
name = "symbols-lookup"
request = "GET /symbols/lookup"
query = { root = "{sandbox}/alpha", name = "parse" }
status = 200

[[step]]
name = "symbols-references"
request = "GET /symbols/lookup"
query = { root = "{sandbox}/alpha", name = "parse", want = "references", fromPath = "src/cli.js" }
status = 200

[[step]]
name = "symbols-search"
request = "GET /symbols/search"
query = { root = "{sandbox}/alpha", query = "par" }
status = 200

[[step]]
name = "symbols-no-root"
request = "GET /symbols/lookup"
status = 400
