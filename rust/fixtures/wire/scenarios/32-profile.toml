about = "Profile and memories: read, save with a base revision, preview, avatar, memory create / suggest by an agent / approve / dismiss / search; with profile:change and user-memory:change frames."

[[step]]
name = "open-stream"
open = "main"
query = { topics = "profile:*,user-memory:*" }

[[step]]
name = "read"
request = "GET /api/profile"
status = 200

[[step]]
name = "save-without-token"
request = "PUT /api/profile"
auth = "none"
body = { patch = { identity = { callName = "Sam" } } }
status = 403

[[step]]
name = "save"
request = "PUT /api/profile"
body = { patch = { identity = { fullName = "Sam Example", callName = "Sam" }, language = { chat = "en" }, work = { roles = ["engineering"], stack = ["rust", "typescript"] }, style = { replies = "terse" }, instructions = "Prefer small commits." }, baseRev = 0 }
status = 200
wait = ["profile:change"]

[[step]]
name = "save-stale"
request = "PUT /api/profile"
body = { patch = { identity = { callName = "Old" } }, baseRev = 0 }
status = 409

[[step]]
name = "save-unknown-field"
request = "PUT /api/profile"
body = { patch = { identity = { nickname = "x" } } }
status = 400

[[step]]
name = "preview"
request = "GET /api/profile/preview"
status = 200

[[step]]
name = "preview-for-project"
request = "GET /api/profile/preview"
query = { kind = "claude", project = "{sandbox}/alpha" }
status = 200

[[step]]
name = "avatar-none"
request = "GET /api/profile/avatar"
status = 404

[[step]]
name = "avatar-not-an-image"
request = "PUT /api/profile/avatar"
text = "not an image"
content_type = "application/octet-stream"
status = 400

[[step]]
name = "avatar-save"
request = "PUT /api/profile/avatar"
base64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4z8DwHwAFAAH/iZk9HQAAAABJRU5ErkJggg=="
status = 200
wait = ["profile:change"]

[[step]]
name = "avatar"
request = "GET /api/profile/avatar"
status = 200

[[step]]
name = "avatar-remove"
request = "DELETE /api/profile/avatar"
status = 200
wait = ["profile:change"]

[[step]]
name = "import-claude-md"
request = "GET /api/profile/import/claude-md"
status = 200

[[step]]
name = "import-claude-md-without-token"
request = "GET /api/profile/import/claude-md"
auth = "none"
status = 403

[[step]]
name = "memories-empty"
request = "GET /api/user-memories"
status = 200

[[step]]
name = "memory-create"
request = "POST /api/user-memories"
body = { text = "When writing Go, use tabs.", category = "work-style", domain = "code", scope = { kind = "global" } }
status = 201
capture = { mem = "/json/memory/id" }
wait = ["user-memory:change"]

[[step]]
name = "memory-create-project"
request = "POST /api/user-memories"
body = { text = "In alpha, run node --test before committing.", category = "stack", scope = { kind = "project", path = "{sandbox}/alpha" }, tier = "on-demand" }
status = 201
capture = { mem_project = "/json/memory/id" }
wait = ["user-memory:change"]

[[step]]
name = "memory-create-invalid"
request = "POST /api/user-memories"
body = { text = "", category = "nonsense", scope = { kind = "global" } }
status = 400

[[step]]
name = "memory-create-without-token"
request = "POST /api/user-memories"
auth = "none"
body = { text = "x", category = "other", scope = { kind = "global" } }
status = 403

[[step]]
name = "suggest-not-an-agent"
request = "POST /api/user-memories/suggest"
body = { text = "The user likes terse replies.", category = "work-style", scope = "global" }
status = 403

[[step]]
name = "suggest-by-agent"
request = "POST /api/user-memories/suggest"
headers = { x-eos-agent-id = "w-CHAT" }
auth = "none"
body = { text = "When asked for a summary, give at most three lines.", category = "work-style", scope = "global", why = "Said twice in this chat." }
status = 201
capture = { suggested = "/json/memory/id" }
wait = ["user-memory:change"]

[[step]]
name = "suggest-duplicate"
request = "POST /api/user-memories/suggest"
headers = { x-eos-agent-id = "w-CHAT" }
auth = "none"
body = { text = "When asked for a summary, give at most three lines.", category = "work-style", scope = "global" }
status = 200

[[step]]
name = "suggest-project"
request = "POST /api/user-memories/suggest"
headers = { x-eos-agent-id = "w-CHAT" }
auth = "none"
body = { text = "In this project, tests live in test/.", category = "stack", scope = "project" }
status = 201
capture = { suggested_project = "/json/memory/id" }
wait = ["user-memory:change"]

[[step]]
name = "suggest-project-without-folder"
request = "POST /api/user-memories/suggest"
headers = { x-eos-agent-id = "w-BARE" }
auth = "none"
body = { text = "No folder here.", category = "other", scope = "project" }
status = 400

[[step]]
name = "memories-all"
request = "GET /api/user-memories"
status = 200

[[step]]
name = "memories-suggested"
request = "GET /api/user-memories"
query = { status = "suggested" }
status = 200

[[step]]
name = "memory-approve"
request = "POST /api/user-memories/{suggested}/approve"
status = 200
wait = ["user-memory:change"]

[[step]]
name = "memory-dismiss"
request = "POST /api/user-memories/{suggested_project}/dismiss"
status = 200
wait = ["user-memory:change"]

[[step]]
name = "suggest-dismissed-again"
request = "POST /api/user-memories/suggest"
headers = { x-eos-agent-id = "w-CHAT" }
auth = "none"
body = { text = "In this project, tests live in test/.", category = "stack", scope = "project" }
status = 200

[[step]]
name = "memory-update"
request = "PUT /api/user-memories/{mem}"
body = { text = "When writing Go, use tabs and gofmt.", tier = "on-demand", baseRev = 0 }
status = 200
wait = ["user-memory:change"]

[[step]]
name = "memory-update-stale"
request = "PUT /api/user-memories/{mem}"
body = { text = "stale", baseRev = 0 }
status = 409

[[step]]
name = "memory-update-unknown"
request = "PUT /api/user-memories/um-00000000"
body = { text = "x" }
status = 404

[[step]]
name = "memory-bad-id"
request = "PUT /api/user-memories/um-short"
body = { text = "x" }
status = 400

[[step]]
name = "search"
request = "GET /api/user-memories/search"
query = { q = "tabs" }
status = 200

[[step]]
name = "search-as-agent"
request = "GET /api/user-memories/search"
headers = { x-eos-agent-id = "w-CHAT" }
query = { q = "node test", limit = "3" }
status = 200

[[step]]
name = "approve-all"
request = "POST /api/user-memories/approve-all"
status = 200

[[step]]
name = "preview-with-memories"
request = "GET /api/profile/preview"
query = { project = "{sandbox}/alpha" }
status = 200

[[step]]
name = "memory-delete"
request = "DELETE /api/user-memories/{mem_project}"
status = 200
wait = ["user-memory:change"]

[[step]]
name = "memory-delete-again"
request = "DELETE /api/user-memories/{mem_project}"
status = 404

[[step]]
name = "project-memory-of-chat"
request = "GET /workers/w-CHAT/memory"
status = 200

[[step]]
name = "project-memory-no-folder"
request = "GET /workers/w-BARE/memory"
status = 404

[[step]]
name = "project-memory-delete"
request = "DELETE /workers/w-CHAT/memory/tabs_in_go"
status = 200

[[step]]
name = "project-memory-delete-without-token"
request = "DELETE /workers/w-CHAT/memory/tabs_in_go"
auth = "none"
status = 403

[[step]]
name = "project-memory-after-delete"
request = "GET /workers/w-CHAT/memory"
status = 200

[[step]]
name = "project-memory-delete-unknown"
request = "DELETE /workers/w-CHAT/memory/nope"
status = 404

[[step]]
name = "close-stream"
close = "main"
