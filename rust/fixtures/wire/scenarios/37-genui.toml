about = "Visual answers: presenting a view and an app as an orchestrator or focused session, rejections with their problem list, reading a view, view state, and the media routes' refusals."

[[step]]
name = "open-stream"
open = "main"
query = { topics = "genui:*" }

[[step]]
name = "present"
request = "POST /api/genui/views"
auth = "none"
headers = { x-eos-agent-id = "w-CHAT" }
body = { input = { title = "Two cafes", tone = "teal", icon = "coffee", data = { places = [{ type = "Place", id = "a", name = "Bean", rating = 4.5, price = 2, area = "Old town" }, { type = "Place", id = "b", name = "Roast", rating = 4.1, price = 3, area = "Harbour" }] }, actions = { pick = { label = "Pick {{name}}", kind = "send" } }, ui = "<Section title=\"Cafes\"><List of=\"places\" variant=\"row\" meta=\"{{area}}\" actions=\"pick\"/></Section><Toggle bind=\"open\" label=\"Open now\"/>", summary = "Bean (4.5) in the Old town and Roast (4.1) at the Harbour." } }
status = 201
capture = { view = "/json/viewId" }

[[step]]
name = "present-as-worker"
request = "POST /api/genui/views"
auth = "none"
headers = { x-eos-agent-id = "w-KID1" }
body = { input = { title = "x", ui = "<Text>x</Text>", summary = "x" } }
status = 403

[[step]]
name = "present-as-nobody"
request = "POST /api/genui/views"
body = { input = { title = "x", ui = "<Text>x</Text>", summary = "x" } }
status = 403

[[step]]
name = "present-rejected"
request = "POST /api/genui/views"
auth = "none"
headers = { x-eos-agent-id = "o-ORCH" }
body = { input = { title = "Broken", data = { rows = [{ name = "a" }] }, ui = "<Tabel of=\"rows\"/><List of=\"missing\"/>", summary = "" } }
status = 400

[[step]]
name = "present-not-an-object"
request = "POST /api/genui/views"
auth = "none"
headers = { x-eos-agent-id = "o-ORCH" }
body = { input = "a string" }
status = 400

[[step]]
name = "present-app"
request = "POST /api/genui/apps"
auth = "none"
headers = { x-eos-agent-id = "o-ORCH" }
body = { input = { title = "Counter", html = "<button id=\"b\">0</button><script>let n=0;b.onclick=()=>b.textContent=++n</script>", summary = "A button that counts clicks.", height = 200 } }
status = 201
capture = { app = "/json/viewId" }

[[step]]
name = "present-app-rejected"
request = "POST /api/genui/apps"
auth = "none"
headers = { x-eos-agent-id = "o-ORCH" }
body = { input = { title = "", html = "" } }
status = 400

[[step]]
name = "view"
request = "GET /api/genui/views/{view}"
status = 200

[[step]]
name = "view-app"
request = "GET /api/genui/views/{app}"
status = 200

[[step]]
name = "view-unknown"
request = "GET /api/genui/views/v_000000000000"
status = 404

[[step]]
name = "view-bad-id"
request = "GET /api/genui/views/nope"
status = 404

[[step]]
name = "state-empty"
request = "GET /api/genui/views/{view}/state"
status = 200

[[step]]
name = "state-save"
request = "PUT /api/genui/views/{view}/state"
body = { state = { open = true, picked = "a" } }
status = 200
wait = ["genui:change"]

[[step]]
name = "state-save-without-token"
request = "PUT /api/genui/views/{view}/state"
auth = "none"
body = { state = { open = false } }
status = 403

[[step]]
name = "state-after"
request = "GET /api/genui/views/{view}/state"
status = 200

[[step]]
name = "state-unknown-view"
request = "PUT /api/genui/views/v_000000000000/state"
body = { state = {} }
status = 404

[[step]]
name = "media-img-without-token"
request = "GET /api/genui/media/img"
auth = "none"
query = { src = "https://example.com/a.png" }
status = 403

[[step]]
name = "media-img-bad-url"
request = "GET /api/genui/media/img"
query = { src = "not a url" }
status = 400

[[step]]
name = "media-img-loopback-refused"
request = "GET /api/genui/media/img"
query = { src = "http://127.0.0.1:7500/health" }
status = 404

[[step]]
name = "media-icon-no-site"
request = "GET /api/genui/media/icon"
status = 400

[[step]]
name = "geocode-no-query"
request = "GET /api/genui/geocode"
status = 400

[[step]]
name = "places-invalid"
request = "POST /api/genui/places"
body = {}
status = 400

[[step]]
name = "location-off"
request = "GET /api/location"
status = 403

[[step]]
name = "location-as-worker"
request = "GET /api/location"
auth = "none"
headers = { x-eos-agent-id = "w-KID1" }
status = 403

[[step]]
name = "close-stream"
close = "main"
