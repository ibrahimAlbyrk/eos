about = "Pages (markdown notes): create, list by project, read, save with a base revision, targeted edits by an agent, delete; with the pages:change frames."

[[step]]
name = "open-stream"
open = "main"
query = { topics = "pages:*" }

[[step]]
name = "list-empty"
request = "GET /api/pages"
query = { all = "1" }
status = 200

[[step]]
name = "create"
request = "POST /api/pages"
body = { title = "Release notes", body = "# Release notes\n\n- [ ] write changelog\n- [x] tag\n", project = "{sandbox}/alpha" }
status = 201
capture = { page = "/json/page/id" }
wait = ["pages:change"]

[[step]]
name = "create-by-agent"
request = "POST /api/pages"
headers = { x-eos-agent-id = "w-KID1" }
body = { title = "Agent findings", body = "Found one caller." }
status = 201
capture = { agent_page = "/json/page/id" }
wait = ["pages:change"]

[[step]]
name = "create-empty"
request = "POST /api/pages"
body = {}
status = 201
capture = { empty_page = "/json/page/id" }
wait = ["pages:change"]

[[step]]
name = "create-bad-type"
request = "POST /api/pages"
body = { title = 5 }
status = 400

[[step]]
name = "list-project"
request = "GET /api/pages"
query = { project = "{sandbox}/alpha" }
status = 200

[[step]]
name = "list-all"
request = "GET /api/pages"
query = { all = "1" }
status = 200

[[step]]
name = "list-search"
request = "GET /api/pages"
query = { all = "1", q = "changelog" }
status = 200

[[step]]
name = "list-as-agent"
request = "GET /api/pages"
headers = { x-eos-agent-id = "w-KID1" }
status = 200

[[step]]
name = "read"
request = "GET /api/pages/{page}"
status = 200

[[step]]
name = "read-unknown"
request = "GET /api/pages/pg-00000000"
status = 404

[[step]]
name = "read-bad-id"
request = "GET /api/pages/nope"
status = 400

[[step]]
name = "save"
request = "PUT /api/pages/{page}"
body = { title = "Release notes 1.1", baseRev = 1 }
status = 200
wait = ["pages:change"]

[[step]]
name = "save-stale"
request = "PUT /api/pages/{page}"
body = { body = "overwritten", baseRev = 1 }
status = 409

[[step]]
name = "edit-append"
request = "POST /api/pages/{page}/edit"
headers = { x-eos-agent-id = "w-KID1" }
body = { op = "append", text = "- [ ] announce", heading = "Later" }
status = 200
wait = ["pages:change"]

[[step]]
name = "edit-replace"
request = "POST /api/pages/{page}/edit"
body = { op = "replace", oldText = "write changelog", newText = "write the changelog" }
status = 200
wait = ["pages:change"]

[[step]]
name = "edit-replace-not-found"
request = "POST /api/pages/{page}/edit"
body = { op = "replace", oldText = "not in the page", newText = "x" }
status = 400

[[step]]
name = "edit-set-task"
request = "POST /api/pages/{page}/edit"
body = { op = "setTask", task = "announce", done = true }
status = 200
wait = ["pages:change"]

[[step]]
name = "edit-unknown-op"
request = "POST /api/pages/{page}/edit"
body = { op = "shuffle" }
status = 400

[[step]]
name = "delete-without-token"
request = "DELETE /api/pages/{empty_page}"
auth = "none"
status = 403

[[step]]
name = "delete"
request = "DELETE /api/pages/{empty_page}"
status = 200
wait = ["pages:change"]

[[step]]
name = "delete-again"
request = "DELETE /api/pages/{empty_page}"
status = 404

[[step]]
name = "delete-agent-page"
request = "DELETE /api/pages/{agent_page}"
status = 200
wait = ["pages:change"]

[[step]]
name = "delete-first"
request = "DELETE /api/pages/{page}"
status = 200
wait = ["pages:change"]

[[step]]
name = "close-stream"
close = "main"
