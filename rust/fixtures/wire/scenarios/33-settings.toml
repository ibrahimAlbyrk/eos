about = "Settings and configuration: user settings, archive, compaction, visual answers, the dashboard's boot config, backends and presets, the Anthropic key status."

[[step]]
name = "open-stream"
open = "main"

[[step]]
name = "ui-config"
request = "GET /api/ui-config"
status = 200

[[step]]
name = "settings"
request = "GET /api/settings"
status = 200

[[step]]
name = "settings-save"
request = "PUT /api/settings"
body = { settings = { "appearance.theme" = "dark", "verbose.enabled" = true, "model.default" = "opus" } }
status = 200

[[step]]
name = "settings-save-as-anyone"
request = "PUT /api/settings"
auth = "none"
body = { settings = { filesShowHidden = true } }
status = 200

[[step]]
name = "settings-protected-key"
request = "PUT /api/settings"
body = { settings = { "genui.level" = "rich" } }
status = 403

[[step]]
name = "settings-bad-shape"
request = "PUT /api/settings"
body = { settings = "dark" }
status = 400

[[step]]
name = "settings-after"
request = "GET /api/settings"
status = 200

[[step]]
name = "archive"
request = "GET /api/settings/archive"
status = 200

[[step]]
name = "archive-save"
request = "PUT /api/settings/archive"
body = { cmdW = "delete" }
status = 200

[[step]]
name = "archive-bad-value"
request = "PUT /api/settings/archive"
body = { retention = "sometimes" }
status = 400

[[step]]
name = "compaction"
request = "GET /api/settings/compaction"
status = 200

[[step]]
name = "compaction-save"
request = "PUT /api/settings/compaction"
body = { threshold = 0.8 }
status = 200

[[step]]
name = "compaction-unknown-key"
request = "PUT /api/settings/compaction"
body = { thresholds = 0.8 }
status = 400

[[step]]
name = "genui"
request = "GET /api/settings/genui"
status = 200

[[step]]
name = "genui-save"
request = "PUT /api/settings/genui"
body = { level = "rich", locationShare = false }
status = 200

[[step]]
name = "genui-save-without-token"
request = "PUT /api/settings/genui"
auth = "none"
body = { level = "off" }
status = 403

[[step]]
name = "genui-bad-level"
request = "PUT /api/settings/genui"
body = { level = "maximal" }
status = 400

[[step]]
name = "anthropic"
request = "GET /api/anthropic/config"
status = 200

[[step]]
name = "anthropic-without-token"
request = "GET /api/anthropic/config"
auth = "none"
status = 403

[[step]]
name = "anthropic-save-nothing"
request = "PUT /api/anthropic/config"
body = {}
status = 200

[[step]]
name = "anthropic-bad-field"
request = "PUT /api/anthropic/config"
body = { apiKey = 5 }
status = 400

[[step]]
name = "presets"
request = "GET /api/backends/presets"
status = 200

[[step]]
name = "backend-models"
request = "GET /api/backends/claude-opus/models"
status = 200

[[step]]
name = "backend-models-unknown"
request = "GET /api/backends/nope/models"
status = 404

[[step]]
name = "backend-add-unknown-preset"
request = "POST /api/backends"
body = { name = "mine", preset = "nope", apiKey = "k" }
status = 400

[[step]]
name = "backend-add-invalid"
request = "POST /api/backends"
body = { name = "" }
status = 400

[[step]]
name = "backend-test-unknown-preset"
request = "POST /api/backends/test"
body = { preset = "nope", apiKey = "k" }
status = 400

[[step]]
name = "backend-test-no-key"
request = "POST /api/backends/test"
body = { preset = "openai" }
status = 400

[[step]]
name = "backend-delete-unknown"
request = "DELETE /api/backends/nope"
status = 404

[[step]]
name = "templates"
request = "GET /api/templates"
status = 200

[[step]]
name = "template-create"
request = "POST /api/templates"
body = { name = "review", content = "Review the diff for bugs.\n", description = "Code review" }
status = 200

[[step]]
name = "template-create-invalid"
request = "POST /api/templates"
body = { name = "Bad Name!" }
status = 400

[[step]]
name = "template-update"
request = "PUT /api/templates/review"
body = { content = "Review the diff for bugs and style.\n" }
status = 200

[[step]]
name = "template-update-unknown"
request = "PUT /api/templates/nope"
body = { content = "x" }
status = 404

[[step]]
name = "templates-after"
request = "GET /api/templates"
status = 200

[[step]]
name = "template-delete"
request = "DELETE /api/templates/review"
status = 200

[[step]]
name = "template-delete-unknown"
request = "DELETE /api/templates/nope"
status = 404

[[step]]
name = "commands"
request = "GET /commands"
status = 200

[[step]]
name = "commands-for-folder"
request = "GET /commands"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "prompts"
request = "GET /api/prompts"
status = 200

[[step]]
name = "prompt-preview"
request = "POST /api/prompts/preview"
body = { role = "worker" }
status = 200

[[step]]
name = "prompt-preview-invalid"
request = "POST /api/prompts/preview"
body = { role = "king" }
status = 400

[[step]]
name = "worker-definitions"
request = "GET /worker-definitions"
status = 200

[[step]]
name = "worker-definitions-for-owner"
request = "GET /worker-definitions"
query = { owner = "o-ORCH" }
status = 200

[[step]]
name = "worker-definition-create"
request = "POST /worker-definitions"
query = { owner = "o-ORCH" }
body = { name = "doc-writer", description = "Writes docs", whenToUse = "For README changes", prompt = "You write documentation." }
status = 201

[[step]]
name = "worker-definition-no-owner"
request = "POST /worker-definitions"
body = { name = "doc-writer" }
status = 400

[[step]]
name = "worker-definitions-with-own"
request = "GET /worker-definitions"
query = { owner = "o-ORCH" }
status = 200

[[step]]
name = "worker-definition-invalid"
request = "POST /worker-definitions"
query = { owner = "o-ORCH" }
body = {}
status = 400

[[step]]
name = "close-stream"
close = "main"
