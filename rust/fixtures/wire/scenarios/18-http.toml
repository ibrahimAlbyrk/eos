about = "Answers that are the same on every route: unknown paths and methods, request ids, weak etags and 304, gzip, unreadable bodies."
record_headers = ["x-request-id", "vary"]

[[step]]
name = "unknown-path"
request = "GET /nope"
status = 404

[[step]]
name = "unknown-method"
request = "POST /health"
status = 404

[[step]]
name = "trailing-slash"
request = "GET /workers/"
status = 404

[[step]]
name = "head-is-not-get"
request = "HEAD /health"
status = 404

[[step]]
name = "request-id-echoed"
request = "GET /health"
headers = { x-request-id = "wire-request-1" }
status = 200

[[step]]
name = "request-id-minted"
request = "GET /health"
status = 200

[[step]]
name = "request-id-on-404"
request = "GET /nope"
headers = { x-request-id = "wire-request-2" }
status = 404

[[step]]
name = "small-answer-has-no-etag"
request = "GET /api/dreams/status"
status = 200

[[step]]
name = "large-answer-has-an-etag"
request = "GET /worker-definitions"
status = 200
capture = { etag = "/headers/etag" }

[[step]]
name = "not-modified"
request = "GET /worker-definitions"
headers = { if-none-match = "{etag}" }
status = 304

[[step]]
name = "etag-mismatch"
request = "GET /worker-definitions"
headers = { if-none-match = "W/\"other\"" }
status = 200

[[step]]
name = "gzip-large"
request = "GET /worker-definitions"
headers = { accept-encoding = "gzip, br" }
status = 200

[[step]]
name = "gzip-small"
request = "GET /api/dreams/status"
headers = { accept-encoding = "gzip" }
status = 200

[[step]]
name = "gzip-not-accepted"
request = "GET /worker-definitions"
headers = { accept-encoding = "br" }
status = 200

[[step]]
name = "body-not-json"
request = "POST /stream/focus"
text = "{ not json"
content_type = "application/json"
status = 500

[[step]]
name = "body-empty"
request = "POST /stream/focus"
status = 400

[[step]]
name = "body-json-array"
request = "POST /stream/focus"
json = "[1, 2]"
status = 400

[[step]]
name = "body-wrong-content-type"
request = "POST /stream/focus"
text = "{\"clientId\":\"wire-tab\",\"workers\":[],\"ptys\":[]}"
content_type = "text/plain"
status = 200

[[step]]
name = "encoded-path-segment"
request = "GET /workers/w%2DCHAT"
status = 404

[[step]]
name = "query-on-a-literal-path"
request = "GET /health"
query = { anything = "1" }
status = 200
