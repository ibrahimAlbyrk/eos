about = "Routes that start, message or resume an agent. Only their refusals are recorded: a success would run a model."

[[step]]
name = "spawn-worker-invalid"
request = "POST /workers"
body = { prompt = 5 }
status = 400

[[step]]
name = "spawn-orchestrator-invalid"
