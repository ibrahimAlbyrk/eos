about = "Changing a repository through the daemon: branch create / rename / delete, checkout, stash apply and drop, and the remote routes on a repository without a remote."

[[step]]
name = "branch-create-without-token"
request = "POST /fs/branch/create"
auth = "none"
body = { cwd = "{sandbox}/alpha", name = "wire/one" }
status = 403

[[step]]
name = "branch-create"
request = "POST /fs/branch/create"
body = { cwd = "{sandbox}/alpha", name = "wire/one", checkout = false }
status = 200

[[step]]
name = "branch-create-existing"
request = "POST /fs/branch/create"
body = { cwd = "{sandbox}/alpha", name = "wire/one", checkout = false }
status = 200

[[step]]
name = "branch-create-invalid"
request = "POST /fs/branch/create"
body = { cwd = "{sandbox}/alpha" }
status = 400

[[step]]
name = "branch-rename"
request = "POST /fs/branch/rename"
body = { cwd = "{sandbox}/alpha", from = "wire/one", to = "wire/two" }
status = 200

[[step]]
name = "branch-rename-missing"
request = "POST /fs/branch/rename"
body = { cwd = "{sandbox}/alpha", from = "wire/none", to = "wire/three" }
status = 200

[[step]]
name = "checkout-dirty"
request = "POST /fs/checkout"
body = { cwd = "{sandbox}/alpha", branch = "feature/json" }
status = 200

[[step]]
name = "checkout-stashing"
request = "POST /fs/checkout"
body = { cwd = "{sandbox}/alpha", branch = "wire/two", stash = true }
status = 200

[[step]]
name = "branches-after-checkout"
request = "GET /fs/branches"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "checkout-missing"
request = "POST /fs/checkout"
body = { cwd = "{sandbox}/alpha", branch = "nope" }
status = 200

[[step]]
name = "checkout-back"
request = "POST /fs/checkout"
body = { cwd = "{sandbox}/alpha", branch = "main" }
status = 200

[[step]]
name = "stashes"
request = "GET /fs/stashes"
query = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "stash-apply"
request = "POST /fs/stash/apply"
body = { cwd = "{sandbox}/alpha", index = 0 }
status = 200

[[step]]
name = "stash-drop"
request = "POST /fs/stash/drop"
body = { cwd = "{sandbox}/alpha", index = 0 }
status = 200

[[step]]
name = "stash-drop-missing"
request = "POST /fs/stash/drop"
body = { cwd = "{sandbox}/alpha", index = 9 }
status = 200

[[step]]
name = "stash-apply-invalid"
request = "POST /fs/stash/apply"
body = { cwd = "{sandbox}/alpha", index = -1 }
status = 400

[[step]]
name = "branch-delete-current"
request = "POST /fs/branch/delete"
body = { cwd = "{sandbox}/alpha", name = "main" }
status = 200

[[step]]
name = "branch-delete"
request = "POST /fs/branch/delete"
body = { cwd = "{sandbox}/alpha", name = "wire/two" }
status = 200

[[step]]
name = "branch-delete-unmerged"
request = "POST /fs/branch/delete"
body = { cwd = "{sandbox}/alpha", name = "feature/json" }
status = 200

[[step]]
name = "branch-delete-forced"
request = "POST /fs/branch/delete"
body = { cwd = "{sandbox}/alpha", name = "feature/json", force = true }
status = 200

[[step]]
name = "fetch-no-remote"
request = "POST /fs/fetch"
body = { cwd = "{sandbox}/alpha" }
status = 200

[[step]]
name = "remote-branch-delete-no-remote"
request = "POST /fs/remote-branch/delete"
body = { cwd = "{sandbox}/alpha", remote = "origin", branch = "x" }
status = 200

[[step]]
name = "not-a-repository"
request = "POST /fs/branch/create"
body = { cwd = "{sandbox}/beta", name = "x" }
status = 200

[[step]]
name = "changes-at-the-end"
request = "GET /fs/changes"
query = { cwd = "{sandbox}/alpha" }
status = 200
