about = "Real data, the event stream: the opening frames, then resuming from the start of this boot (what the boot published), from a malformed point and from another boot — after a boot on a real data folder, whatever the boot published is replayed. Private recordings only."
read_only = true

[[step]]
name = "open"
open = "main"
capture = { epoch = "/frames/main/2/data/epoch" }

[[step]]
name = "read-while-open"
request = "GET /workers"
query = { brief = "1" }
status = 200

[[step]]
name = "close"
close = "main"

# Usage rounds are left out: whether a read starts one depends on how long the
# reads before it took.
[[step]]
name = "resume-from-boot"
open = "boot"
query = { since = "{epoch}-0", topics = "worker:*,state:*,pages:*,profile:*,user-memory:*,plugins:*,pending:*,policy:*,notification:*,genui:*" }

[[step]]
name = "close-boot"
close = "boot"

[[step]]
name = "resume-filtered"
open = "filtered"
query = { since = "{epoch}-0", topics = "worker:*" }

[[step]]
name = "close-filtered"
close = "filtered"

[[step]]
name = "resume-other-boot"
open = "stale"
query = { since = "000000000000-5" }

[[step]]
name = "close-stale"
close = "stale"

[[step]]
name = "resume-malformed"
open = "malformed"
query = { since = "nope" }

[[step]]
name = "close-malformed"
close = "malformed"
