about = "Real data, feature by feature: every list and detail the dashboard and the phone read outside a transcript — chat lists, projects, pages, profile and memories, settings, plugins, jobs, templates, worker definitions, policy and pending, accounts and usage, sync, transfers, peers, remote, updates, dreams, visual answers — and files and git on a project folder (a throwaway repository on a private copy). Private recordings only."
read_only = true

[[step]]
name = "workers"
request = "GET /workers"
status = 200
capture = { cwd = "/json/[agent_role=focused]/cwd" }

[[step]]
name = "workers-brief"
request = "GET /workers"
status = 200
query = { brief = "1" }

[[step]]
name = "workers-of-orchestrator"
request = "GET /workers"
status = 200
query = { parentId = "{c_orch}" }
optional = true

