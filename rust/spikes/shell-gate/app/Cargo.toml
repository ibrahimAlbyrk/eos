[package]
name = "eos-shell-gate"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "eos-shell-gate"
path = "src/main.rs"

# The macOS CEF helper with the no-bridge patch (the bundler's cef-helper/main.rs + patch).
[[bin]]
name = "eos-shell-gate-helper"
path = "src/helper.rs"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = ["unstable", "devtools"] }
tauri-runtime-cef = { version = "=3.0.0-alpha.7", features = ["devtools", "unstable"] }
cef = { version = "=154.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }

[features]
default = ["sandbox"]
sandbox = []
