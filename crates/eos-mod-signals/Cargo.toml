[package]
name = "eos-mod-signals"
description = "Signals: what starts a routine's runs. Signals a source saw are kept once, each routine that takes them decides by its rules, and a matched signal admits its run in the same write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eos-contracts.workspace = true
eos-core.workspace = true
eos-domain.workspace = true
eos-inbox.workspace = true
eos-prompts.workspace = true
eos-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
eos-fs.workspace = true
eos-git.workspace = true
eos-kit-proc.workspace = true
eos-platform.workspace = true
eos-store-files.workspace = true
eos-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
