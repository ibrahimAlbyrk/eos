# A routine's sessions (workers in routine_sessions, and every worker they start) are not
# the user's chats. No recording holds one, so this names the scenario a recording of them
# would carry.

[[known]]
scenario = "*-routine-sessions"
reason = "A routine's sessions are left out of GET /workers, GET /workers/archived and the dashboard's and phone's row patches (their changes become remove patches); GET /workers/{id} still serves them. Shapes, fields and statuses are unchanged: only which rows exist. The 0.1.x app had no routines."

# A tab says which routine runs it shows (`runs` in POST /stream/focus, `?runs=` on
# GET /stream). No recording sends one, so this names the scenario a recording would carry.

[[known]]
scenario = "*-stream-runs"
reason = "A tab may name the runs it shows (body field `runs`, query `?runs=`, at most 64): it then gets `run:activity` for them, and a tab that names none gets no `run:activity`. Older dashboards send neither and get every other topic as before. The 0.1.x app had no routines."

# The phone link serves routines to phones that ask (cap `eos`). No recording holds such a
# phone, so this names the scenario a recording of one would carry.

[[known]]
scenario = "*-phone-eos"
reason = "The snapshot's `caps` list `eos` after `focus`, `rows` and `deflate`: the Mac serves routines, runs and Needs you. A phone that lists `eos` in its hello gets `routine:change`, `run:change`, `inbox:change` and `runs:active` as events while it is not away, and may send `watch {run}` to get that run's `run:activity`. A phone that does not list it (the released app) never gets them and ignores the unknown cap; every other frame is today's. The 0.1.x app had no routines."

[[known]]
scenario = "*"
at = "/json/counts/**"
reason = "Sync's status counts the records of each domain this app syncs. It syncs domains the TypeScript app did not have: `experience` (what Eos learned from work), `routine` (routines and their kept versions) and `run` (summaries of finished runs, 30 days), `surface` (surfaces' kept designs and saved state), `capability` (capabilities' definitions, never a secret), and the leases of which computer runs each routine, which are not a domain."

