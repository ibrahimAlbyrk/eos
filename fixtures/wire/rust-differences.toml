# The Rust app has no goal loops, and sends no prompt after an account switch.

[[known]]
scenario = "*"
step = "*prompts"
at = "/json/prompts/**"
reason = "The prompt library holds no goal-loop prompts (`loop/*`, `tool/dynamic_loop`): the Rust app has no goal loops. Nor `accounts/continue`: a session moved to another sign-in carries its cut-off turn on with no new input (eos-engine `switch_account`), so nothing of Eos's enters the chat. Nor `compaction/summarizer-system`: a session summarizes inside its own conversation, before the request that would pass its threshold, and carries on (eos-engine `compaction.rs`), so `compaction/summarize` is the request appended to it (its variable is only `INSTRUCTIONS`) and `compaction/continuation` the message the turn goes on from (`SUMMARY`, `TRANSCRIPT_ARCHIVE`). The list is today's without those ten, the two compaction prompts in their own words. It also lists `tool/list_capabilities` and `tool/call_capability`, the prompts of two tools the TypeScript app did not have, and `reactions`, `tool/react`, `tool/no_reply` and `role/focused/06-models`, the prompts of reactions and of a focused chat's subagent models, which it did not have either. Nor did it have `memory/reflect-system`, `memory/reflect`, `memory/generalize-system`, `memory/generalize` and `tool/recall_experience`, the prompts eos-memory turns moments into notes and widens lessons with, and that of the tool a chat recalls what Eos learned from work with."

